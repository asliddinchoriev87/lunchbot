services:
  - type: worker
    name: lunchbot
    runtime: docker
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    maxShutdownDelaySeconds: 30
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PAYMENT_RECIPIENT_NAMES
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: ORDER_OPEN_TIME
        value: "10:00"
      - key: ORDER_CLOSE_TIME
        value: "11:00"
      - key: REMINDER_TIMES
        value: 10:20,10:35,10:50
      - key: DATABASE_PATH
        value: /data/lunchbot.db
    disk:
      name: lunchbot-data
      mountPath: /data
      sizeGB: 1
